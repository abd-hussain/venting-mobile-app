name: api_client
description: "A new Flutter package project."
version: 0.0.1
publish_to: none

environment:
  sdk: '>=3.9.2 <4.0.0'
resolution: workspace

dependencies:
  dio: 5.8.0+1
  native_dio_adapter: 1.3.0
  fpdart: 1.1.1
  logger_manager: any

  flutter:
    sdk: flutter
  dio_cache_interceptor: ^4.0.3

dev_dependencies:
  dependency_validator: 5.0.5
  venting_lint:
    path: ../custom_lint
  flutter_test:
    sdk: flutter
  mocktail: 1.0.4
  dart_code_metrics_presets: 2.22.0

flutter:
  uses-material-design: true
  assets:
    - test/fixtures/mock_response.json
