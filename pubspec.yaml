name: venting_mobile_app
description: "Venting is a mobile platform that connects people who need someone to talk to (Venters) with compassionate, verified listeners (Listeners) through secure, private voice conversations."

publish_to: 'none'

version: 1.0.0

environment:
  sdk: '>=3.11.5 <4.0.0'

workspace:
  - utilities/api_client
  - utilities/venting_lint
  - utilities/internet_connection
  - utilities/logger_manager
  - utilities/preferences
  - utilities/shimmer_manager
  - utilities/network_logging

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  async: ^2.11.0
  cupertino_icons: ^1.0.8
  cached_network_image: ^3.4.1
  bloc: 9.2.1
  flutter_bloc: 9.1.1
  flutter_svg: 2.2.1
  fpdart: 1.1.1
  freezed_annotation: ^3.1.0
  get_it: 8.0.3
  go_router: 16.2.4
  image_picker: ^1.0.7
  file_picker: ^11.0.2
  injectable: 2.5.0
  json_annotation: 4.9.0
  lottie: ^3.3.2
  permission_handler: 12.0.0+1
  url_launcher: ^6.3.1
  uuid: ^4.5.2
  video_player: ^2.10.1
  intl: 0.20.2
  google_fonts: ^8.2.0
  device_info_plus: ^11.1.0
  overlay_support: ^2.1.0
  api_client: any
  internet_connection: any
  logger_manager: any
  network_logging: any
  preferences: any


dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.8.0
  dependency_validator: 5.0.5
  flutter_gen_runner: 5.12.0
  freezed: 3.2.3
  injectable_generator: ^2.9.0
  json_serializable: ^6.11.2
  melos: 7.1.1
  mocktail: any
  bloc_test: ^10.0.0



melos:
  # Optional: treat the root as a package too (so it shows in melos list)
  useRootAsPackage: true

  scripts:
    upgrade:
      run: melos exec -c 1 -- flutter pub upgrade
      description: Upgrade all dependencies.

    analyze:
      run: melos exec -c 1 --fail-fast -- "flutter analyze --fatal-infos"
      description: Run `flutter analyze` on all packages.

    analyze_changes:
      run: |
        melos exec -c 1 --fail-fast --diff=origin/main...HEAD --include-dependents -- "flutter analyze --fatal-infos"
      description: Run `flutter analyze` on changed packages.

    fix_check:
      run: melos exec -- "dart fix --dry-run"
      description: Run `dart fix` checks on all packages.

    test:
      run: |
        melos exec -c 1 --fail-fast -- "flutter test --no-pub"
      packageFilters:
        dirExists:
          - test
      description: Run `flutter test` checks on all packages.

    test_changes:
      run: |
        melos exec -c 1 --fail-fast --diff=origin/main...HEAD --include-dependents -- "flutter test --no-pub"
      packageFilters:
        dirExists:
          - test
      description: Run tests on changed packages.

    test_coverage:
      run: |
        melos exec -c 1 --dir-exists=test -- "flutter test --coverage"
        dart run tool/merge_coverage.dart
      description: Run tests with coverage in all packages and merge lcov.info.

    coverage_html:
      run: dart run tool/generate_coverage_html.dart
      description: Generate coverage/html/index.html from coverage/lcov.info.

    test_and_coverage_html:
      run: |
        melos run test_coverage
        melos run coverage_html
      description: Run all package tests with merged coverage and generate HTML.

    format_check_changes:
      run: melos exec --diff=origin/main...HEAD -- "bash
        $MELOS_ROOT_PATH/scripts/format.sh --set-exit-if-changed"
      description: Run `dart format` checks on changed packages.

    format_check:
      run: melos exec -- "bash $MELOS_ROOT_PATH/scripts/format.sh
        --set-exit-if-changed"
      description: Run `dart format` checks on all packages.

    format:
      run: melos exec -- "bash $MELOS_ROOT_PATH/scripts/format.sh"
      description: Runs `dart format` on all packages.

    dependency_validator:
      run: melos exec -c 1 -- "dart run dependency_validator"
      description: Run `dart run dependency_validator` checks on all packages.

    dependency_validator_changes:
      run: melos exec -c 1 --diff=origin/main...HEAD --include-dependents -- "dart run
        dependency_validator"
      description: Run `dart run dependency_validator` checks on changed packages.

    gen_l10n:
      run: flutter gen-l10n
      description: Generate VentingMobLocalizations from ARB files.

    autogen:
      run: melos exec -c 1 -- "dart run build_runner build
        --delete-conflicting-outputs"
      packageFilters:
        dependsOn:
          - "build_runner"
      description: Run `dart run build_runner build --delete-conflicting-outputs`

    autogen_watch:
      run: melos exec -c 1 -- "dart run build_runner watch
        --delete-conflicting-outputs"
      packageFilters:
        dependsOn:
          - "build_runner"
      description: Run `dart run build_runner watch --delete-conflicting-outputs`

    autogen_changes:
      run: melos exec -c 1 -- "dart run build_runner build
        --delete-conflicting-outputs"
      packageFilters:
        dependsOn:
          - "build_runner"
        diff: origin/main...HEAD
      description: Run `dart run build_runner build --delete-conflicting-outputs`

flutter:

  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/
