name: CI/CD Deploy

on:
  push:
    branches:
      - main
      - dev

env:
  BUILD_TIMESTAMP: ${{ github.run_number }}

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🧭 Resolve Android flavor from branch
        run: |
          set -euo pipefail
          BRANCH="${{ github.ref_name }}"
          if [ "$BRANCH" = "main" ]; then
            FLAVOR="prod"
            ENTRYPOINT="lib/main_prod.dart"
            DART_DEFINE_FILE=".env/config.prod.json"
            PACKAGE_NAME="com.vent.ventingMobileApp"
            AAB_PATH="build/app/outputs/bundle/prodRelease/app-prod-release.aab"
          elif [ "$BRANCH" = "dev" ]; then
            FLAVOR="dev"
            ENTRYPOINT="lib/main_dev.dart"
            DART_DEFINE_FILE=".env/config.dev.json"
            PACKAGE_NAME="com.vent.ventingMobileApp.dev"
            AAB_PATH="build/app/outputs/bundle/devRelease/app-dev-release.aab"
          else
            echo "❌ Unsupported branch for Android deploy: $BRANCH"
            exit 1
          fi

          {
            echo "FLAVOR=$FLAVOR"
            echo "ENTRYPOINT=$ENTRYPOINT"
            echo "DART_DEFINE_FILE=$DART_DEFINE_FILE"
            echo "PACKAGE_NAME=$PACKAGE_NAME"
            echo "AAB_PATH=$AAB_PATH"
          } >> "$GITHUB_ENV"

          echo "🌿 Branch=$BRANCH → flavor=$FLAVOR package=$PACKAGE_NAME"

      - name: 🧹 Free disk space (Android & tooling)
        run: |
          echo "Before cleanup:" && df -h
          # Remove huge Android images & emulator
          sudo rm -rf "$ANDROID_HOME/system-images" || true
          sudo rm -rf "$ANDROID_HOME/emulator" || true
          # Remove all NDKs (add a keep rule if you actually use NDK)
          sudo rm -rf "$ANDROID_HOME/ndk" || true
          # Clear APT caches & ghcup (large on runners)
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          sudo rm -rf /opt/ghc /usr/local/.ghcup || true
          # Docker cleanup (safe on hosted runners)
          docker system prune -af || true
          echo "After cleanup:" && df -h

      - name: 📊 Display Build Information
        run: |
          echo "🚀 Starting CI/CD Deploy #${{ github.run_number }}"
          echo "📅 Build Date: $(date '+%Y-%m-%d %H:%M UTC')"
          echo "🔢 Run Number: ${{ github.run_number }}"
          echo "📝 Commit: ${{ github.sha }}"
          echo "👤 Author: ${{ github.actor }}"
          echo "🌿 Branch: ${{ github.ref_name }}"
          echo "📦 Flavor: $FLAVOR"
          echo "🎯 Entrypoint: $ENTRYPOINT"
          echo "📱 Package: $PACKAGE_NAME"

      - name: 🔥 Set Up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'oracle'
          java-version: '17'

      - name: 🔎 Clean Gradle Cache (optional)
        run: rm -rf ~/.gradle/caches

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # Keep in sync with .fvmrc (Flutter 3.41.7)
          flutter-version-file: .fvmrc
          channel: 'stable'
          cache: true

      - name: ✅ Accept Android Licenses
        run: sudo ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses <<< "y"

      - name: 🗳️ Flutter gen-l10n
        run: flutter gen-l10n

      - name: 🗳️ Flutter Pub Get
        run: flutter pub get

      - name: 🗃️ Generate code (build_runner)
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: 🔑 Set up key.properties
        env:
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_CONTENT: ${{ secrets.ANDROID_KEY_CONTENT }}
        run: |
          if [ -n "$ANDROID_KEY_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_CONTENT" ]; then
            echo "keyPassword=$ANDROID_KEY_PASSWORD" > android/key.properties
            echo "storePassword=$ANDROID_KEY_PASSWORD" >> android/key.properties
            echo "keyAlias=$ANDROID_KEY_ALIAS" >> android/key.properties
            echo "$ANDROID_KEY_CONTENT" | base64 --decode > android/androidkeystore.jks
            ls -la android/key.properties android/androidkeystore.jks
          else
            echo "Warning: Android signing secrets not found. Skipping key setup."
          fi

      - name: 🔑 Set up local.properties
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> android/local.properties

      - name: 🔑 Set up Play Store Secret
        env:
          PLAY_STORE_SECRET: ${{ secrets.PLAY_STORE_SECRET }}
        run: |
          if [ -n "$PLAY_STORE_SECRET" ]; then
            echo "$PLAY_STORE_SECRET" | base64 --decode > android/play_store_secret.json
            ls -la android/play_store_secret.json
          else
            echo "Warning: Play Store secret not found. Skipping Play Store setup."
          fi

      - name: 🎯 Setup Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3
          rubygems: latest

      - name: 🔎 Cleaning cache before we start
        run: |
          flutter clean
          rm -rf ~/.pub-cache
          rm -rf pubspec.lock
          rm -rf $HOME/.gradle/caches
          flutter pub get

      - name: 📦 Install Android SDK 35/36 + Build-Tools
        run: |
          sudo ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-35" "build-tools;35.0.0" \
            "platforms;android-36" "build-tools;36.0.0" \
            "platform-tools"

      - name: 🔐 Fix Android config dir perms (prevent keystore issues)
        run: |
          mkdir -p "$HOME/.android" "$HOME/.config/.android"
          sudo chown -R "$USER:$USER" "$HOME/.android" "$HOME/.config" || true
          chmod -R u+rwX "$HOME/.android" "$HOME/.config"

      # ✅ Fast & reliable verification using a debug APK + aapt
      # Flutter 3.41.x defaults to targetSdk 36 for this project.
      - name: 🔍 Verify targetSdk with aapt (must be 36)
        run: |
          set -euo pipefail
          flutter build apk --debug \
            --flavor "$FLAVOR" \
            -t "$ENTRYPOINT" \
            --dart-define-from-file="$DART_DEFINE_FILE"
          APK="build/app/outputs/flutter-apk/app-${FLAVOR}-debug.apk"
          test -f "$APK" || { echo "❌ Not found: $APK"; exit 1; }
          INFO="$(${ANDROID_HOME}/build-tools/36.0.0/aapt dump badging "$APK")"
          echo "$INFO" | grep -E "sdkVersion|targetSdkVersion" || true
          # robust parse + trim
          TSDK="$(echo "$INFO" | grep -Po "targetSdkVersion:'\K[0-9]+" | head -n1 | tr -dc '0-9')"
          if [ -z "$TSDK" ]; then
            echo "❌ Could not parse targetSdkVersion from aapt output"
            exit 2
          fi
          if [ "$TSDK" != "36" ]; then
            echo "❌ Expected targetSdkVersion=36 but found: $TSDK"
            exit 2
          fi
          echo "🎯 targetSdkVersion=$TSDK (OK)"

      - name: 🛠️ Build and Deploy
        id: build
        run: |
          if [ ! -f android/androidkeystore.jks ] || [ ! -f android/key.properties ]; then
            echo "❌ Missing Android signing files. Set secrets ANDROID_KEY_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_CONTENT."
            exit 1
          fi
          if [ ! -f android/play_store_secret.json ]; then
            echo "❌ Missing Play Store credentials. Set secret PLAY_STORE_SECRET."
            exit 1
          fi
          make deploy-android
          # Extract build number from pubspec.yaml for commit message
          BUILD_NUMBER=$(grep "^version:" pubspec.yaml | sed 's/version: .*+//')
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "flavor=$FLAVOR" >> "$GITHUB_OUTPUT"
          echo "Build completed with flavor=$FLAVOR build number=$BUILD_NUMBER"

      - name: 📝 Update commit message with build number
        if: success()
        run: |
          BUILD_NUMBER="${{ steps.build.outputs.build_number }}"
          FLAVOR_NAME="${{ steps.build.outputs.flavor }}"
          COMMIT_MSG="🚀 Deploy $FLAVOR_NAME build $BUILD_NUMBER - $(date '+%Y-%m-%d %H:%M:%S')"
          echo "Updated commit message: $COMMIT_MSG"

  ios:
    runs-on: macos-15

    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🧭 Resolve iOS flavor from branch
        run: |
          set -euo pipefail
          BRANCH="${{ github.ref_name }}"
          if [ "$BRANCH" = "main" ]; then
            FLAVOR="prod"
            ENTRYPOINT="lib/main_prod.dart"
            DART_DEFINE_FILE=".env/config.prod.json"
            BUNDLE_ID="com.vent.ventingMobileApp"
            IOS_SCHEME="prod"
          elif [ "$BRANCH" = "dev" ]; then
            FLAVOR="dev"
            ENTRYPOINT="lib/main_dev.dart"
            DART_DEFINE_FILE=".env/config.dev.json"
            BUNDLE_ID="com.vent.ventingMobileApp.dev"
            IOS_SCHEME="dev"
          else
            echo "❌ Unsupported branch for iOS deploy: $BRANCH"
            exit 1
          fi

          {
            echo "FLAVOR=$FLAVOR"
            echo "ENTRYPOINT=$ENTRYPOINT"
            echo "DART_DEFINE_FILE=$DART_DEFINE_FILE"
            echo "BUNDLE_ID=$BUNDLE_ID"
            echo "IOS_SCHEME=$IOS_SCHEME"
          } >> "$GITHUB_ENV"

          echo "🌿 Branch=$BRANCH → flavor=$FLAVOR scheme=$IOS_SCHEME bundle=$BUNDLE_ID"

      - name: 📊 Display iOS Build Information
        run: |
          echo "🍎 Starting iOS CI/CD Deploy #${{ github.run_number }}"
          echo "📅 Build Date: $(date '+%Y-%m-%d %H:%M UTC')"
          echo "🔢 Run Number: ${{ github.run_number }}"
          echo "📝 Commit: ${{ github.sha }}"
          echo "👤 Author: ${{ github.actor }}"
          echo "🌿 Branch: ${{ github.ref_name }}"
          echo "📦 Flavor: $FLAVOR"
          echo "🎯 Entrypoint: $ENTRYPOINT"
          echo "📱 Bundle: $BUNDLE_ID"
          echo "📐 Scheme: $IOS_SCHEME"

      - name: 🔀 Select Xcode with iPhoneOS SDK
        shell: bash
        run: |
          set -euo pipefail

          choose_xcode() {
            for X in "$@"; do
              SDK="$X/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs/iphoneos.sdk"
              [[ -d "$SDK" ]] || continue

              >&2 echo "Checking $X"
              if /usr/libexec/PlistBuddy -c 'Print :DTPlatformVersion' "$SDK/SDKSettings.plist" 2>/dev/null | grep -q '^18'; then
                echo "$X"; return 0
              fi
              echo "$X"; return 0
            done
            return 1
          }

          PICK="$(choose_xcode \
            /Applications/Xcode_16.4.app \
            /Applications/Xcode_16.3.app \
            /Applications/Xcode_16.2.app \
            /Applications/Xcode_16.1.app \
            /Applications/Xcode_16.app \
            /Applications/Xcode.app)"

          if [[ -z "$PICK" ]]; then
            echo "❌ No suitable Xcode 16.x with iPhoneOS SDK found" >&2
            exit 1
          fi

          echo "Using Xcode: $PICK" >&2
          echo "DEVELOPER_DIR=$PICK/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$PICK"
          sudo xcodebuild -runFirstLaunch || true
          xcodebuild -version
          xcodebuild -showsdks || true

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # Keep in sync with .fvmrc (Flutter 3.41.7)
          flutter-version-file: .fvmrc
          channel: 'stable'
          cache: true

      - name: 🗳️ Flutter gen-l10n
        run: flutter gen-l10n

      - name: 🗳️ Flutter Pub Get
        run: flutter pub get

      - name: 🗃️ Generate code (build_runner)
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: 🧰 Set up App Store Connect API key
        env:
          APPSTORE_CONNECT: ${{ secrets.APPSTORE_CONNECT }}
        run: |
          if [ -z "$APPSTORE_CONNECT" ]; then
            echo "❌ Missing secret APPSTORE_CONNECT (base64 of App Store Connect API key JSON)."
            exit 1
          fi
          echo "$APPSTORE_CONNECT" | base64 --decode > ios/app_store_connect.json
          ls -la ios/app_store_connect.json

      - name: 🎯 Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: ios
        env:
          RUNNER_TOOL_CACHE: /Users/runner/hostedtoolcache
          RUNNER_TEMP: /Users/runner/work/_temp

      - name: 📦 Ensure Fastlane available
        run: |
          gem install fastlane --no-document
          ruby -v
          which ruby
          fastlane -v

      - name: 🧩 Ensure Flutter xcconfigs include Pods
        run: |
          ensure_line () { FILE="$1"; LINE="$2"; grep -qF "$LINE" "$FILE" || echo "$LINE" >> "$FILE"; }
          ensure_line ios/Flutter/Debug.xcconfig   '#include? "Pods/Target Support Files/Pods-Runner/Pods-Runner.debug.xcconfig"'
          ensure_line ios/Flutter/Release.xcconfig '#include? "Pods/Target Support Files/Pods-Runner/Pods-Runner.release.xcconfig"'
          ensure_line ios/Flutter/Profile.xcconfig '#include? "Pods/Target Support Files/Pods-Runner/Pods-Runner.profile.xcconfig"'

      - name: 🧹 Pods clean install
        run: |
          pushd ios
          pod deintegrate
          rm -f Podfile.lock
          pod install
          popd

      - name: 🧪 Pre-warm xcodebuild & validate scheme
        run: |
          xcodebuild -version
          xcodebuild -list -workspace ios/Runner.xcworkspace
          xcodebuild -resolvePackageDependencies \
            -workspace ios/Runner.xcworkspace \
            -scheme "$IOS_SCHEME" \
            -destination 'generic/platform=iOS'

      - name: 🔐 Configure git auth for Match (Venting-Certificates)
        env:
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.GIT_BASIC_AUTHORIZATION }}
        run: |
          set -euo pipefail
          if [ -z "${MATCH_GIT_BASIC_AUTHORIZATION:-}" ]; then
            echo "❌ Missing secret GIT_BASIC_AUTHORIZATION"
            echo "   Create it as: echo -n 'abd-hussain:ghp_xxx' | base64 | pbcopy"
            echo "   PAT needs read access to abd-hussain/Venting-Certificates"
            exit 1
          fi

          AUTH="$(printf '%s' "$MATCH_GIT_BASIC_AUTHORIZATION" | tr -d '\n\r ')"
          DECODED="$(printf '%s' "$AUTH" | base64 --decode 2>/dev/null || true)"
          if [[ "$DECODED" != *:* ]]; then
            echo "❌ GIT_BASIC_AUTHORIZATION does not decode to 'username:token'"
            echo "   Use: echo -n 'abd-hussain:ghp_YOUR_PAT' | base64 | pbcopy"
            exit 1
          fi

          USER="${DECODED%%:*}"
          TOKEN="${DECODED#*:}"
          if [ -z "$USER" ] || [ -z "$TOKEN" ]; then
            echo "❌ Decoded GIT_BASIC_AUTHORIZATION has empty username or token"
            exit 1
          fi

          # Prefer git rewrite over Match's http.extraheader (unreliable on some runners).
          # URL-encode user/token so special characters in PATs are safe.
          AUTH_URL="$(
            USER="$USER" TOKEN="$TOKEN" python3 - <<'PY'
          import os, urllib.parse
          u = urllib.parse.quote(os.environ["USER"], safe="")
          t = urllib.parse.quote(os.environ["TOKEN"], safe="")
          print(f"https://{u}:{t}@github.com/")
          PY
          )"
          git config --global url."${AUTH_URL}".insteadOf "https://github.com/"

          echo "✅ git url.insteadOf configured for github.com"
          echo "🔍 Testing plain HTTPS access to Venting-Certificates..."
          if ! git ls-remote "https://github.com/abd-hussain/Venting-Certificates.git" HEAD >/dev/null; then
            echo "❌ Cannot read Venting-Certificates after configuring git credentials"
            echo "   Check: PAT still valid, has 'repo' (classic) or Contents:Read on that private repo,"
            echo "   and username matches the account that owns the token."
            exit 1
          fi
          echo "✅ Match certificates repo is reachable"
          # Keep env for Match fallback / debugging (trimmed base64)
          echo "MATCH_GIT_BASIC_AUTHORIZATION=$AUTH" >> "$GITHUB_ENV"

      - name: 🛠️ Build and Deploy to TestFlight
        id: build-ios
        env:
          MATCH_PASSWORD: ${{ secrets.IOS_MATCH_PASSWORD }}
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "120"
          FASTLANE_XCODEBUILD_SETTINGS_RETRIES: "6"
        run: |
          if [ -z "${MATCH_PASSWORD:-}" ]; then
            echo "❌ Missing secret IOS_MATCH_PASSWORD (Match encryption passphrase)."
            exit 1
          fi
          make deploy-ios
          BUILD_NUMBER=$(grep "^version:" pubspec.yaml | sed 's/version: .*+//')
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "flavor=$FLAVOR" >> "$GITHUB_OUTPUT"
          echo "iOS build completed with flavor=$FLAVOR build number=$BUILD_NUMBER"

      - name: 📝 Capture iOS build number
        if: success()
        run: |
          BUILD_NUMBER="${{ steps.build-ios.outputs.build_number }}"
          FLAVOR_NAME="${{ steps.build-ios.outputs.flavor }}"
          COMMIT_MSG="🍎 iOS Deploy $FLAVOR_NAME build $BUILD_NUMBER - $(date '+%Y-%m-%d %H:%M')"
          echo "Updated commit message: $COMMIT_MSG"
